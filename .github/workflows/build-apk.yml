name: Build Android APK

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # 黑屏防线：Metro 打包不查类型，「漏 import → 实机 ReferenceError → 黑屏」CI 照样绿
      # （2026-10-14 v1.9.16 事故：Home.tsx 用了未 import 的 TVText，实机黑屏）。
      # 2026-11-14 起 16 个存量类型债已清零——门禁升级为任何 TS 错误都拦，
      # 防止类型债再次常态化积累
      - name: Typecheck (zero errors)
        run: |
          TSC_OUT=$(npx tsc --noEmit 2>&1 || true)
          BAD=$(echo "$TSC_OUT" | grep "error TS" || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::存在 TypeScript 错误——Metro 不查类型，类型问题只会在实机暴露"
            exit 1
          fi

      # 纯逻辑单测（v1.9.24 起）：焦点引擎打分/同排优先/合并排队、歌词过滤、更新镜像链
      - name: Unit tests (pure logic)
        run: npm test

      - name: Bundle JS (重新编译，覆盖仓库里的旧 bundle)
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build release APK (minify + debug签名，体积减半)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZL_Musicos-debug-apk-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # master 推送：把三架构 APK 自动上传到版本号对应的 Release（v<version>）。
      # Release 由网关侧提前建好（带完整更新说明）；这里只负责传 APK 资产，
      # 彻底摆脱「本机下载 artifact 必截断」的问题（09-19 实证）。
      - name: Publish versioned APKs (master)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK_DIR=android/app/build/outputs/apk/release
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}"
          echo "Publishing APKs to release ${TAG}"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} not found - creating a minimal one"
            gh release create "${TAG}" --title "ZL-Musicos ${TAG}" --notes "见 Release 页更新说明" --target "$GITHUB_SHA"
          fi
          for ABI in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            APK=$(ls "$APK_DIR"/*"${ABI}"*.apk 2>/dev/null | head -n1 || true)
            if [ -n "$APK" ]; then
              cp "$APK" "ZL-Musicos-${TAG}-${ABI}.apk"
              gh release upload "${TAG}" "ZL-Musicos-${TAG}-${ABI}.apk" --clobber
            fi
          done
          echo "Release ${TAG} assets:"
          gh release view "${TAG}" --json assets -q '.assets[].name'

      # master 发版后自动重写 publish/tv-version.json（v1.9.23 更新分发链）：
      # 旧版本 App 的「检查更新」读这个清单；下载链接带国内可达镜像前缀。
      # [skip ci] 防止这次回写再触发一轮构建。
      - name: Refresh tv-version.json manifest (master)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}"
          python3 - "$TAG" <<'PYEOF'
          import json, subprocess, sys
          tag = sys.argv[1]
          out = subprocess.check_output(["gh", "api", f"repos/kaosZL/ZL_Musicos/releases/tags/{tag}"], text=True)
          rel = json.loads(out)
          mirror = "https://ghfast.top/"
          assets = []
          for a in rel.get("assets", []):
              name = a["name"]
              abi = None
              for cand in ("arm64-v8a", "armeabi-v7a", "x86_64", "x86", "universal"):
                  if name.lower().endswith(f"-{cand}.apk"):
                      abi = cand
                      break
              if not abi:
                  continue
              assets.append({"abi": abi, "name": name, "url": mirror + a["browser_download_url"], "size": a["size"]})
          manifest = {
              "version": tag[1:],
              "tagName": tag,
              "releaseUrl": rel.get("html_url", ""),
              "body": (rel.get("name") or tag),
              "assets": assets,
          }
          with open("publish/tv-version.json", "w") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(f"manifest written: {tag}, {len(assets)} assets")
          PYEOF
          if git diff --quiet publish/tv-version.json; then
            echo "manifest unchanged, skip commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publish/tv-version.json
            git commit -m "chore: tv-version.json -> ${TAG}（CI 自动维护） [skip ci]"
            git push
          fi
